# Render Blueprint (https://render.com/docs/blueprint-spec): the same Docker image as `docker compose up`.
# Free plan chosen by the author (2026-10-07): the service sleeps after 15 minutes without use. The data lives
# in Neon's free PostgreSQL since 2026-10-25, because Render's free database expires after 30 days; the
# Render database below stays only until the move is checked (see docs/DEPLOYMENT.md).
databases:
  - name: scoremaster-db
    plan: free
    region: frankfurt
    databaseName: scoremaster
    user: scoremaster
    postgresMajorVersion: "17"
    ipAllowList: []          # only Render services reach it

services:
  - type: web
    name: scoremaster
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true         # every merge into main
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon's direct connection string (with sslmode=require); never in the repository
      - key: APP_ENV
        value: production    # Secure cookies and no interactive API docs (Render serves HTTPS)
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEMO_USER_EMAIL
        value: demo@scoremaster.local
      - key: DEMO_SEED_CONTENT
        value: "1"         # the demo account starts with works, band, concert and campaign
      - key: DEMO_USER_PASSWORD
        sync: false          # asked when the Blueprint is created; never in the repository
      - key: ADMIN_EMAILS
        sync: false          # accounts that manage evaluation campaigns and see their results (comma-separated)
      - key: YOUTUBE_API_KEY
        sync: false          # optional
      - key: GEMINI_API_KEY
        sync: false          # optional: without it the explanations use the identified demo
      - key: OMR_GITHUB_REPO
        sync: false          # optional: the PDF reader's private repository (user/scoremaster-omr)
      - key: OMR_GITHUB_TOKEN
        sync: false          # its fine-grained token (Contents: write); without both, PDFs are not offered
      - key: GOOGLE_CLIENT_ID
        sync: false          # optional: Google sign-in stays off while empty
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
