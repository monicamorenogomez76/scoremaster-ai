name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Throwaway credentials for the PostgreSQL service that lives only inside each job.
env:
  POSTGRES_DB: scoremaster
  POSTGRES_USER: scoremaster
  POSTGRES_PASSWORD: ci-only-password
  DATABASE_URL: postgresql+psycopg://scoremaster:ci-only-password@127.0.0.1:5432/scoremaster

jobs:
  audit:
    # Known vulnerabilities in the dependencies (2026-10-13: starlette, python-multipart, authlib and
    # langchain-core had them; all were upgraded). A new advisory turns the check red.
    name: Dependencias sin vulnerabilidades conocidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Frontend (npm audit)
        run: npm --prefix frontend audit --omit=dev --audit-level=high

  tests:
    name: Python, Node y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scoremaster
          POSTGRES_USER: scoremaster
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scoremaster -d scoremaster"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          npm --prefix frontend ci
          pip install -r requirements.txt
      - name: Compilar frontend
        run: npm --prefix frontend run build
      - name: Pruebas unitarias del frontend
        run: node --test backend/test/frontend/*.test.mjs
      - name: Pruebas Python con PostgreSQL real
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest -q -rs

  e2e:
    name: Recorridos Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scoremaster
          POSTGRES_USER: scoremaster
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scoremaster -d scoremaster"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SCOREMASTER_URL: http://127.0.0.1:8006
      PLAYWRIGHT_MODULE: /tmp/browser-tests/node_modules/playwright
      DEMO_USER_EMAIL: demo@scoremaster.local
      DEMO_USER_PASSWORD: scoremaster-demo
      ADMIN_EMAILS: directora-e2e@banda.test,admin-a11y@banda.test
      # The PDF option is shown (and audited) with a reader that the walkthroughs never start.
      OMR_GITHUB_REPO: ci/sin-lector
      OMR_GITHUB_TOKEN: ci-sin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias y Chromium
        run: |
          npm --prefix frontend ci
          pip install -r requirements.txt
          npm install --prefix /tmp/browser-tests playwright@1.63.0 axe-core@4.10.2
          /tmp/browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Compilar frontend y migrar la base
        run: |
          npm --prefix frontend run build
          python -m alembic upgrade head
          python -m backend.app.seed_demo
      - name: Arrancar la aplicación
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8006 > /tmp/uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf "$SCOREMASTER_URL/health" && exit 0; sleep 1; done
          cat /tmp/uvicorn.log; exit 1
      - name: Pentagramas de un pasaje
        run: node backend/test/frontend/musicxml-passage.e2e.mjs
      - name: Carga y análisis
        run: node backend/test/frontend/react-upload.e2e.mjs
      - name: Visores y reproducción
        run: node backend/test/frontend/workflow.e2e.mjs
      - name: Panel, banda, ensayo y vídeos
        run: node backend/test/frontend/dashboard.e2e.mjs
      - name: Conciertos y serie de ensayos
        run: node backend/test/frontend/concerts.e2e.mjs
      - name: Bandas y plantilla activa
        run: node backend/test/frontend/bands.e2e.mjs
      - name: Campañas de valoración de la directora
        run: node backend/test/frontend/evaluation.e2e.mjs
      - name: Accesibilidad WCAG 2.1 A y AA (axe-core)
        run: node backend/test/frontend/accessibility.e2e.mjs
      - name: Registro del servidor
        if: failure()
        run: cat /tmp/uvicorn.log

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Construir la imagen
        run: docker build --tag scoremaster-ai:ci .
