services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scoremaster}
      POSTGRES_USER: ${POSTGRES_USER:-scoremaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scoremaster}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-scoremaster}
      # Test credentials published in the README; change them outside a local demo.
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@scoremaster.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-scoremaster-demo}
      # The demo account starts with three works, a band, a concert with its rehearsals and a campaign.
      DEMO_SEED_CONTENT: ${DEMO_SEED_CONTENT:-1}
      # Accounts that manage evaluation campaigns and see the musicians' emails and results (comma-separated).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Google sign-in stays disabled unless both values are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Explanations by Gemini (step 21); without a key the identified demo answers.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # «Valorar con IA» (method B) may use a model with more free quota; pause between requests and time limit.
      GEMINI_REVIEW_MODEL: ${GEMINI_REVIEW_MODEL:-}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
