# PDF reader of ScoreMaster (decided 2026-10-27). Only this workflow lives in its private repository (scoremaster-omr),
# copied there by scripts/deploy_omr_worker.sh; the reader's code (omr/) is checked out from ScoreMaster's main branch
# at every reading, so it updates itself like the app on Render (2026-10-28). While ScoreMaster's repository is
# private, the secret SCOREMASTER_READ_TOKEN (read-only, that repository only) lets it check out; once public, none is
# needed. ScoreMaster starts it with a repository_dispatch event "read-pdf"; the job (PDF addresses, kind, title and a
# one-time token) reaches omr/worker.py through GitHub's event file, never through a variable of the step (GitHub
# prints those) nor written into a command. Everything is pinned to what the feasibility test measured: copisteria at
# its commit, the copista-2m weights at their revision, PyTorch for CPU.
name: Leer PDF

on:
  repository_dispatch:
    types: [read-pdf]

permissions:
  contents: read

# One reading at a time; the next waits for it.
concurrency:
  group: omr
  cancel-in-progress: false

env:
  SCOREMASTER_REPOSITORY: monicamorenogomez76/scoremaster-ai
  COPISTERIA_COMMIT: 5d1cd54286bb8a27e33a495c88fadf0e2101152d
  COPISTA_REVISION: c37d89e1e52edc95c1a73bda0aea5f2f71a9c763

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: The reader's code, from ScoreMaster's main branch
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SCOREMASTER_REPOSITORY }}
          ref: main
          path: scoremaster
          # The reader and ScoreMaster's instrument catalog (backend/domain, standard library only; 2026-10-28).
          sparse-checkout: |
            omr
            backend/domain
          token: ${{ secrets.SCOREMASTER_READ_TOKEN || github.token }}
          persist-credentials: false

      # Before installing anything, so the director sees «Preparando el lector» at once.
      - name: Tell ScoreMaster the reader started
        run: python3 scoremaster/omr/started.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Kept between readings even when one fails (actions/cache saves only after a success).
      - name: Restore PyTorch, the packages and copista
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/pip
            copisteria
          key: omr-torch2.14.1-${{ hashFiles('scoremaster/omr/requirements.txt') }}-${{ env.COPISTERIA_COMMIT }}-${{ env.COPISTA_REVISION }}

      - name: Poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: PyTorch (CPU) and the reader's packages
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scoremaster/omr/requirements.txt

      - name: Download copisteria and the weights
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/kobimusic/copisteria copisteria
          git -C copisteria checkout "$COPISTERIA_COMMIT"
          python -c "from huggingface_hub import hf_hub_download as get; import os; \
          [get('kobimusic/copista-2m', name, revision=os.environ['COPISTA_REVISION'], local_dir='copisteria/models') \
           for name in ('evidence-2m.pt', 'small/v7_obj-recall_best.pt')]"

      - name: Install copisteria
        run: pip install --no-deps -e copisteria

      - name: Keep PyTorch, the packages and copista for the next readings
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/pip
            copisteria
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The job (with its one-time token) is read from the event file: a variable of the step would be printed here.
      # copista-2m is loaded once and reads the pages one after another (2026-10-28).
      - name: Read the PDFs
        working-directory: scoremaster
        run: python -m omr.worker
