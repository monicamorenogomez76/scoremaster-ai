# PDF reader of ScoreMaster (decided 2026-10-27). It runs in its private repository (scoremaster-omr), copied there by
# scripts/deploy_omr_worker.sh, never in ScoreMaster's own. ScoreMaster starts it with a repository_dispatch event
# "read-pdf"; the job (PDF addresses, kind, title and a one-time token) reaches omr/worker.py through GitHub's event
# file, never through a variable of the step (GitHub prints those) nor written into a command. Everything is pinned
# to what the feasibility test measured: copisteria at its commit, the copista-2m weights at their revision, PyTorch
# for CPU.
name: Leer PDF

on:
  repository_dispatch:
    types: [read-pdf]

permissions:
  contents: read

# One reading at a time; the next waits for it.
concurrency:
  group: omr
  cancel-in-progress: false

env:
  COPISTERIA_COMMIT: 5d1cd54286bb8a27e33a495c88fadf0e2101152d
  COPISTA_REVISION: c37d89e1e52edc95c1a73bda0aea5f2f71a9c763

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: omr/requirements.txt

      - name: Poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: PyTorch (CPU) and the reader's packages
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r omr/requirements.txt

      - name: copisteria and the copista-2m weights (kept between readings)
        id: copisteria
        uses: actions/cache@v6
        with:
          path: copisteria
          key: copisteria-${{ env.COPISTERIA_COMMIT }}-${{ env.COPISTA_REVISION }}

      - name: Download copisteria and the weights
        if: steps.copisteria.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/kobimusic/copisteria copisteria
          git -C copisteria checkout "$COPISTERIA_COMMIT"
          python -c "from huggingface_hub import hf_hub_download as get; import os; \
          [get('kobimusic/copista-2m', name, revision=os.environ['COPISTA_REVISION'], local_dir='copisteria/models') \
           for name in ('evidence-2m.pt', 'small/v7_obj-recall_best.pt')]"

      - name: Install copisteria
        run: pip install --no-deps -e copisteria

      # The job (with its one-time token) is read from the event file: a variable of the step would be printed here.
      - name: Read the PDFs
        env:
          COPISTERIA_DIR: ${{ github.workspace }}/copisteria
        run: python -m omr.worker
