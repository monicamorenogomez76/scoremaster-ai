<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoreMasterAI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #101827;
        --panel: #1f2937;
        --panel-alt: #111827;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --primary: #60a5fa;
        --success: #34d399;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg), #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        width: min(920px, 92vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        padding: 32px;
      }
      h1 { margin-top: 0; font-size: clamp(2rem, 3vw, 3rem); }
      p { color: var(--muted); }
      form {
        display: grid;
        gap: 18px;
        margin-top: 24px;
      }
      input, textarea, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        padding: 12px 14px;
        font-size: 1rem;
      }
      input[type="file"], textarea {
        background: rgba(31, 41, 55, 0.7);
        color: var(--text);
      }
      button {
        background: var(--primary);
        color: #0f172a;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .result {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(148, 163, 184, 0.28);
      }
      .result-title { margin: 0 0 8px; font-size: 1.5rem; }
      .result-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 28px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 16px 0 8px;
      }
      .metric-card {
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 14px;
        padding: 16px;
      }
      .metric-card .label {
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .metric-card .value {
        margin-top: 10px;
        font-size: clamp(1.6rem, 2vw, 2.2rem);
        font-weight: 700;
      }
      .metric-card .subvalue {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .result-section {
        min-width: 0;
        padding: 18px 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }
      .result-section--wide { grid-column: 1 / -1; }
      .result-section h2 { margin: 0 0 12px; font-size: 1.1rem; }
      .result-metric { margin: 0; font-size: 1.5rem; font-weight: 700; }
      .result-supporting { margin: 6px 0 0; color: var(--muted); }
      .family-row {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(148, 163, 184, 0.14);
      }
      .family-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--text);
      }
      .family-bar {
        height: 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.15);
        overflow: hidden;
      }
      .family-bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #60a5fa, #34d399);
      }
      .pill {
        display: inline-block;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.35);
        border-radius: 999px;
        padding: 5px 9px;
        color: #bfdbfe;
        font-size: 0.75rem;
        margin-right: 8px;
      }
      .result-list { margin: 12px 0 0; padding: 0; list-style: none; }
      .result-list li { padding: 10px 0; border-top: 1px solid rgba(148, 163, 184, 0.14); }
      .result-empty { color: var(--muted); }
      @media (max-width: 640px) {
        .result-summary { grid-template-columns: minmax(0, 1fr); }
        .dashboard-grid { grid-template-columns: minmax(0, 1fr); }
        .result-section--wide { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ScoreMasterAI</h1>
      <p>Sube una partitura MusicXML (.musicxml, .mxl o .xml válido) para analizar su dificultad, adaptación a la banda y plan de ensayo.</p>

      <form id="upload-form">
        <input id="file" type="file" accept=".musicxml,.mxl,.xml" required />
        <textarea id="band-profile" rows="4" placeholder='{"Flute": 1, "Clarinet": 1}'></textarea>
        <input id="total-minutes" type="number" min="10" value="60" aria-label="Minutos totales de ensayo" />
        <button type="submit">Subir y analizar</button>
      </form>

      <div id="result" class="result" hidden></div>
    </div>

    <script>
      const form = document.getElementById('upload-form');
      const resultBox = document.getElementById('result');
      const submitButton = form.querySelector('button[type="submit"]');
      const submitLabel = submitButton.textContent;
      const difficultyLabels = {
        low: 'Baja',
        moderate: 'Moderada',
        high: 'Alta',
        very_high: 'Muy alta'
      };
      const bandStatusLabels = {
        ok: 'Compatible',
        warning: 'Requiere revisar la plantilla',
        critical: 'Incompatibilidad importante'
      };
      const findingLabels = {
        SL003: 'Alta densidad rítmica',
        SL004: 'Intervalos amplios',
        SL005: 'Registro agudo'
      };
      const rehearsalReasons = {
        'High rhythmic density in the selected passage.': 'Alta densidad rítmica en este pasaje.',
        'Default rehearsal block.': 'Bloque general de ensayo.'
      };

      function appendText(parent, tagName, className, value) {
        const element = document.createElement(tagName);
        if (className) element.className = className;
        element.textContent = value;
        parent.append(element);
        return element;
      }

      function appendList(section, entries, emptyMessage) {
        const list = document.createElement('ul');
        list.className = 'result-list';
        if (entries.length === 0) {
          appendText(list, 'li', 'result-empty', emptyMessage);
        } else {
          entries.forEach((entry) => appendText(list, 'li', '', entry));
        }
        section.append(list);
      }

      function createSection(parent, title, wide = false) {
        const section = document.createElement('section');
        section.className = wide ? 'result-section result-section--wide' : 'result-section';
        appendText(section, 'h2', '', title);
        parent.append(section);
        return section;
      }

      function renderAnalysis(data) {
        const summary = document.createElement('div');
        summary.className = 'result-summary';
        resultBox.replaceChildren();
        appendText(resultBox, 'h2', 'result-title', data.title || 'Partitura sin título');

        const difficulty = data.difficulty || {};
        const familyEntries = Object.entries(difficulty.by_family || {});
        const maxFamilyScore = Math.max(...familyEntries.map(([, details]) => Number(details.score || 0)), 1);
        const criticalPassages = difficulty.critical_passages || [];

        const dashboard = document.createElement('div');
        dashboard.className = 'dashboard-grid';

        const overallCard = document.createElement('div');
        overallCard.className = 'metric-card';
        overallCard.innerHTML = '<div class="label">Dificultad</div><div class="value">' + (difficulty.overall_score ?? 0) + '</div><div class="subvalue">Nivel: ' + (difficultyLabels[difficulty.level] || 'Sin clasificar') + '</div>';
        dashboard.append(overallCard);

        const passagesCard = document.createElement('div');
        passagesCard.className = 'metric-card';
        passagesCard.innerHTML = '<div class="label">Pasajes críticos</div><div class="value">' + criticalPassages.length + '</div><div class="subvalue">Agrupados por instrumento y familia</div>';
        dashboard.append(passagesCard);

        const familyCard = document.createElement('div');
        familyCard.className = 'metric-card';
        familyCard.innerHTML = '<div class="label">Familias</div><div class="value">' + familyEntries.length + '</div><div class="subvalue">Secciones con mayor carga</div>';
        dashboard.append(familyCard);

        resultBox.append(dashboard);
        resultBox.append(summary);

        const difficultySection = createSection(summary, 'Dificultad');
        const difficultyCards = Object.entries(difficulty.by_instrument || {}).map(([instrument, details]) => {
          const findings = (details.findings || []).map((code) => findingLabels[code] || code).join(', ');
          return instrument + ': ' + details.score + (findings ? ' · ' + findings : '');
        });
        appendList(difficultySection, difficultyCards, 'No se detectaron dificultades por instrumento.');

        const familySection = createSection(summary, 'Familias');
        if (familyEntries.length === 0) {
          appendText(familySection, 'p', 'result-empty', 'No hay familias con hallazgos relevantes.');
        } else {
          familyEntries.forEach(([family, details]) => {
            const row = document.createElement('div');
            row.className = 'family-row';
            const header = document.createElement('div');
            header.className = 'family-header';
            header.innerHTML = '<span>' + family + '</span><strong>' + (details.score || 0) + '</strong>';
            const bar = document.createElement('div');
            bar.className = 'family-bar';
            const fill = document.createElement('span');
            fill.style.width = Math.max(12, Math.round(((details.score || 0) / maxFamilyScore) * 100)) + '%';
            bar.append(fill);
            row.append(header, bar);
            const badges = document.createElement('div');
            (details.instruments || []).forEach((instrument) => {
              const pill = document.createElement('span');
              pill.className = 'pill';
              pill.textContent = instrument;
              badges.append(pill);
            });
            row.append(badges);
            familySection.append(row);
          });
        }

        const passagesSection = createSection(summary, 'Pasajes críticos', true);
        if (criticalPassages.length === 0) {
          appendText(passagesSection, 'p', 'result-empty', 'No hay pasajes críticos detectados.');
        } else {
          const passageList = document.createElement('ul');
          passageList.className = 'result-list';
          criticalPassages.forEach((passage) => {
            const item = document.createElement('li');
            item.innerHTML = '<strong>' + passage.instrument + '</strong> · ' + passage.family + ' · compases ' + passage.measure_range + ' · score ' + passage.score + '<br>' + (passage.findings || []).map((code) => '<span class="pill">' + (findingLabels[code] || code) + '</span>').join('');
            passageList.append(item);
          });
          passagesSection.append(passageList);
        }

        const bandFit = data.band_fit || {};
        const bandSection = createSection(summary, 'Adaptación a la banda');
        appendText(
          bandSection,
          'p',
          'result-metric',
          String(bandFit.compatibility_percent ?? 0) + '%'
        );
        appendText(
          bandSection,
          'p',
          'result-supporting',
          bandStatusLabels[bandFit.status] || 'Estado no disponible'
        );
        const bandIssues = (bandFit.issues || []).map((issue) => {
          if (issue.available === 0) {
            return issue.instrument + ': falta en la plantilla; se necesita ' + issue.required + '.';
          }
          return issue.instrument + ': hay ' + issue.available + ' músicos y se necesitan ' + issue.required + '.';
        });
        appendList(bandSection, bandIssues, 'La plantilla cubre los instrumentos requeridos.');

        const rehearsal = data.rehearsal_plan || {};
        const rehearsalSection = createSection(summary, 'Plan de ensayo', true);
        appendText(
          rehearsalSection,
          'p',
          'result-supporting',
          'Duración total: ' + (rehearsal.total_minutes ?? 0) + ' minutos'
        );
        const segments = (rehearsal.segments || []).map((segment) => {
          const reason = rehearsalReasons[segment.reason] || segment.reason || 'Pasaje seleccionado para trabajar.';
          return segment.instrument + ' · compás ' + segment.measure_range + ' · ' + segment.minutes + ' min · ' + reason;
        });
        appendList(rehearsalSection, segments, 'No hay bloques de ensayo disponibles.');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const fileInput = document.getElementById('file');
        const file = fileInput.files[0];
        if (!file) {
          resultBox.hidden = false;
          resultBox.textContent = 'Selecciona un archivo MusicXML.';
          return;
        }

        const payload = new FormData();
        payload.append('file', file);
        resultBox.hidden = false;
        resultBox.textContent = 'Analizando la partitura. Puede tardar unos segundos...';
        submitButton.disabled = true;
        submitButton.textContent = 'Analizando...';

        try {
          const profile = document.getElementById('band-profile').value.trim();
          payload.append('band_profile', profile || '{}');
          payload.append('total_minutes', document.getElementById('total-minutes').value || '60');

          const response = await fetch('/analyze', { method: 'POST', body: payload });
          const data = await response.json();

          resultBox.hidden = false;
          if (!response.ok) {
            resultBox.textContent = 'Error: ' + (data.detail || JSON.stringify(data));
            return;
          }

          renderAnalysis(data);
        } catch (error) {
          resultBox.hidden = false;
          resultBox.textContent = 'Error en la solicitud: ' + error.message;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = submitLabel;
        }
      });
    </script>
  </body>
</html>
